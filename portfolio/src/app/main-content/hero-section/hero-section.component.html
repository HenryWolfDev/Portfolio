<section>
  <div class="title-box">
    <div class="image-box">
      <img src="assets/Design material/03_Stickers/Polaroid Frame.png" alt="" />
      <p>Henry :)</p>
    </div>
    <div>
      <button
        class="hello-world-btn"
        (mouseenter)="isHovered = true"
        (mouseleave)="isHovered = false"
        [ngClass]="{ hovered: isHovered }"
      >
        <span class="text-default">Hello world</span>
        <span class="text-hover">I’m Henry Wolf</span>
        <img
          class="hand-img"
          src="assets/Design material/04_Icons/waving_hand.png"
        />
      </button>
    </div>
    <p class="frontend title-word">
      @for(letter of frontendLetters; track $index){
      <span class="letter">{{ letter }}</span
      >}
    </p>
    <p class="DEVELOPER title-word">
      @for(letter of developerLetters; track $index){
      <span class="letter">{{ letter }}</span
      >}
    </p>
    <div><button class="get-in-touch-btn">Get in Touch</button></div>
  </div>
</section>
