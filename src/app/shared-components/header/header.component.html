<ng-template #languageSwitch>
  <div class="language-switch-box">
    <span
      (click)="useLanguage('en')"
      [class.active]="currentLang === 'en'"
      [class.inactive]="currentLang !== 'en'"
      >EN

      <img
        class="toggle-line"
        src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/Toggle.png"
        alt=""
      />
    </span>

    <div
      class="switch-icon-box"
      [class.lang-en]="currentLang === 'en'"
      [class.lang-de]="currentLang === 'de'"
    >
      <img
        class="switch-bar"
        src="assets/icons/switch_bar.png"
        alt="switch left"
      />
      <img
        class="switch-point"
        src="assets/icons/switch_point.png"
        alt="switch right"
      />
    </div>

    <span
      (click)="useLanguage('de')"
      [class.active]="currentLang === 'de'"
      [class.inactive]="currentLang !== 'de'"
      >DE

      <img
        class="toggle-line"
        src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/Toggle.png"
        alt=""
      />
    </span>
  </div>
</ng-template>

<header class="HEADER">
  <div class="container">
    <div class="content">
      <div class="logo-box">
        <img class="logo_1" src="assets/icons/logo_HW.png" alt="" />
        <img class="logo_2" src="assets/icons/logo_HW_yellow.png" alt="" />
      </div>
      <!-- #region Header-links -->

      <div
        class="about-me-link"
        (mouseenter)="mouseEntered('about')"
        (mouseleave)="mouseLeaved('about')"
      >
        <a href="#about-me-section">{{ "HEADER.ABOUT_ME" | translate }}</a>
        <img
          class="about-me-draw-line"
          src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/1.png"
          alt=""
          [class.draw-forward]="isHovering('about')"
          [class.draw-reverse]="!isHovering('about') && hasHovered('about')"
          (animationend)="onAnimationEnd($event, 'about')"
        />
      </div>
      <div
        class="skills-link"
        (mouseenter)="mouseEntered('skills')"
        (mouseleave)="mouseLeaved('skills')"
      >
        <a href="#skill-set-section">{{ "HEADER.SKILLS" | translate }}</a>
        <img
          class="skill-draw-line"
          src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/2.png"
          alt=""
          [class.draw-forward]="isHovering('skills')"
          [class.draw-reverse]="!isHovering('skills') && hasHovered('skills')"
          (animationend)="onAnimationEnd($event, 'skills')"
        />
      </div>
      <div
        class="projects-link"
        (mouseenter)="mouseEntered('projects')"
        (mouseleave)="mouseLeaved('projects')"
      >
        <a href="#projects-section">{{ "HEADER.PROJECTS" | translate }}</a>
        <img
          class="project-draw-line"
          src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/4.png"
          alt=""
          [class.draw-forward]="isHovering('projects')"
          [class.draw-reverse]="
            !isHovering('projects') && hasHovered('projects')
          "
          (animationend)="onAnimationEnd($event, 'projects')"
        />
      </div>
      <div
        class="contact-link"
        (mouseenter)="mouseEntered('contact')"
        (mouseleave)="mouseLeaved('contact')"
      >
        <a href="#contact-section">{{ "HEADER.CONTACT" | translate }}</a>
        <img
          class="contact-draw-line"
          src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/3.png"
          alt=""
          [class.draw-forward]="isHovering('contact')"
          [class.draw-reverse]="!isHovering('contact') && hasHovered('contact')"
          (animationend)="onAnimationEnd($event, 'contact')"
        />
      </div>

      <!-- #endregion Header-links -->
      <!-- #region language-switch -->
      <ng-container *ngTemplateOutlet="languageSwitch"></ng-container>

      <!-- #region mobile burger-menu -->
      <button
        type="button"
        class="burger-button"
        [class.is-open]="isMenuOpen"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <img
          class="burger-icon"
          src="assets/icons/burger-default.png"
          alt="Open menu"
        />
        <span class="burger-close-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <!-- #endregion language-switch -->
  <div
    class="mobile-menu"
    *ngIf="menuVisible"
    [class.is-open]="isMenuOpen"
    [class.is-closing]="isClosing"
  >
    <div
      class="mobile-menu__inner"
      [class.is-open]="isMenuOpen"
      [class.is-closing]="isClosing"
    >
      <div class="mobile-menu__top">
        <img
          src="assets/icons/logo_1.png"
          alt="Logo"
          class="mobile-menu__logo"
        />
        <button
          type="button"
          class="mobile-menu__close"
          aria-label="Close navigation"
          (click)="closeMenu()"
        >
          <span></span>
          <span></span>
        </button>
      </div>
      <div class="mobile-menu__middle">
        <nav class="mobile-menu__links">
          <a href="#about-me-section" (click)="closeMenu()">{{
            "HEADER.ABOUT_ME" | translate
          }}</a>
          <a href="#skill-set-section" (click)="closeMenu()">{{
            "HEADER.SKILLS" | translate
          }}</a>
          <a href="#projects-section" (click)="closeMenu()">{{
            "HEADER.PROJECTS" | translate
          }}</a>
          <a href="#contact-section" (click)="closeMenu()">{{
            "HEADER.CONTACT" | translate
          }}</a>
        </nav>
        <div class="mobile-menu__language">
          <ng-container *ngTemplateOutlet="languageSwitch"></ng-container>
        </div>
      </div>
      <div class="mobile-menu__bottom">
        <div class="social-icon-box">
          <a
            href="https://www.linkedin.com/in/henry-wolf-261baa383/"
            target="_blank"
            ><img
              class="social-icon"
              src="assets/icons/in.png"
              alt="LinkedIn logo"
          /></a>

          <a href="https://github.com/HenryWolfDev" target="_blank">
            <img
              class="social-icon"
              src="assets/icons/git-hub.png"
              alt="GitHub logo"
          /></a>

          <a href="mailto:HWolf.binz@gmail.com"
            ><img
              class="social-icon"
              src="assets/icons/mail.png"
              alt="Email icon"
          /></a>
        </div>
      </div>
    </div>
  </div>
</header>
