<header class="HEADER">
  <div class="container">
    <div class="content">
      <div class="logo-box">
        <img class="logo_1" src="/assets/icons/logo_1.png" alt="" />
        <img class="logo_2" src="/assets/icons/logo_1_hover.png" alt="" />
      </div>
      <!-- #region Header-links -->

      <div
        class="about-me-link"
        (mouseenter)="mouseEntered('about')"
        (mouseleave)="mouseLeaved('about')"
      >
        <a href="#about-me-section">{{ "HEADER.ABOUT_ME" | translate }}</a>
        <img
          class="about-me-draw-line"
          src="/assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/1.png"
          alt=""
          [class.draw-forward]="isHovering('about')"
          [class.draw-reverse]="!isHovering('about') && hasHovered('about')"
          (animationend)="onAnimationEnd($event, 'about')"
        />
      </div>
      <div
        class="skills-link"
        (mouseenter)="mouseEntered('skills')"
        (mouseleave)="mouseLeaved('skills')"
      >
        <a href="#skill-set-section">{{ "HEADER.SKILLS" | translate }}</a>
        <img
          class="skill-draw-line"
          src="/assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/2.png"
          alt=""
          [class.draw-forward]="isHovering('skills')"
          [class.draw-reverse]="!isHovering('skills') && hasHovered('skills')"
          (animationend)="onAnimationEnd($event, 'skills')"
        />
      </div>
      <div
        class="projects-link"
        (mouseenter)="mouseEntered('projects')"
        (mouseleave)="mouseLeaved('projects')"
      >
        <a href="#projects-section">{{ "HEADER.PROJECTS" | translate }}</a>
        <img
          class="project-draw-line"
          src="/assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/4.png"
          alt=""
          [class.draw-forward]="isHovering('projects')"
          [class.draw-reverse]="
            !isHovering('projects') && hasHovered('projects')
          "
          (animationend)="onAnimationEnd($event, 'projects')"
        />
      </div>
      <div
        class="contact-link"
        (mouseenter)="mouseEntered('contact')"
        (mouseleave)="mouseLeaved('contact')"
      >
        <a href="#contact-section">{{ "HEADER.CONTACT" | translate }}</a>
        <img
          class="contact-draw-line"
          src="/assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/3.png"
          alt=""
          [class.draw-forward]="isHovering('contact')"
          [class.draw-reverse]="!isHovering('contact') && hasHovered('contact')"
          (animationend)="onAnimationEnd($event, 'contact')"
        />
      </div>

      <!-- #endregion Header-links -->
      <!-- #region language-switch -->
      <div class="language-switch-box">
        <span
          (click)="useLanguage('en')"
          [class.active]="currentLang === 'en'"
          [class.inactive]="currentLang !== 'en'"
          >EN

          <img
            class="toggle-line"
            src="/assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/Toggle.png"
            alt=""
          />
        </span>

        <div
          class="switch-icon-box"
          [class.lang-en]="currentLang === 'en'"
          [class.lang-de]="currentLang === 'de'"
        >
          <img
            class="switch-bar"
            src="/assets/icons/switch_bar.png"
            alt="switch left"
          />
          <img
            class="switch-point"
            src="/assets/icons/switch_point.png"
            alt="switch right"
          />
        </div>

        <span
          (click)="useLanguage('de')"
          [class.active]="currentLang === 'de'"
          [class.inactive]="currentLang !== 'de'"
          >DE

          <img
            class="toggle-line"
            src="/assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/Toggle.png"
            alt=""
          />
        </span>
      </div>
    </div>
  </div>

  <!-- #endregion language-switch -->
</header>
