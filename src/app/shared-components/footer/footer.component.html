<footer>
  <div class="container">
    <div class="content">
      <div class="icon-box">
        <div class="logo-box">
          <img class="logo_1" src="assets/icons/logo_HW.png" alt="" />
          <img class="logo_2" src="assets/icons/logo_HW_yellow.png" alt="" />
        </div>
        <div class="text-box">
          <span>&copy; Henry Wolf 2025</span>
          <a
            class="legal-notice legal-notice--mobile"
            [routerLink]="['/legal-notice']"
            (mouseenter)="mouseEntered('legal-notice')"
            (mouseleave)="mouseLeaved('legal-notice')"
            >Legal Notice</a
          >
        </div>
      </div>
      <div class="footer-links-box">
        <ul>
          <!-- #region Legal Notice structure -->
          <li>
            <a
              class="legal-notice"
              [routerLink]="['/legal-notice']"
              (mouseenter)="mouseEntered('legal-notice')"
              (mouseleave)="mouseLeaved('legal-notice')"
              >Legal Notice</a
            >
            <img
              class="draw-notice-line"
              src="assets/Design material/00_Hand-drawn lines/00_Header/Color option 1/3.png"
              alt=""
              [class.draw-forward]="isHovering('legal-notice')"
              [class.draw-reverse]="
                !isHovering('legal-notice') && hasHovered('legal-notice')
              "
              (animationend)="onAnimationEnd($event, 'legal-notice')"
            />
          </li>
          <!-- #endregion Legal Notice structure -->
          <!-- #region GitHub Icon Structure -->
          <li>
            <a
              class="footer-link"
              href="https://github.com/HenryWolfDev"
              target="_blank"
              (mouseenter)="mouseEntered('github')"
              (mouseleave)="mouseLeaved('github')"
              >Github
              <img
                class="footer-link-icon"
                src="assets/icons/git-hub.png"
                alt=""
            /></a>
          </li>
          <!-- #endregion GitHub Icon Structure -->
          <!-- #region Linkedin icon structure -->
          <li>
            <a
              class="footer-link"
              href="https://www.linkedin.com/in/henry-wolf-261baa383/"
              target="_blank"
              (mouseenter)="mouseEntered('LinkedIn')"
              (mouseleave)="mouseLeaved('LinkedIn')"
              >LinkedIn
              <img class="footer-link-icon" src="assets/icons/in.png" alt=""
            /></a>
          </li>
          <!-- #endregion Linkedin icon structure -->
          <!-- #region Mail icon structure -->
          <li>
            <a
              class="footer-link"
              href="mailto:HWolf.binz@gmail.com"
              (mouseenter)="mouseEntered('Email')"
              (mouseleave)="mouseLeaved('Email')"
              >Email
              <img class="footer-link-icon" src="assets/icons/mail.png" alt=""
            /></a>
          </li>
          <!-- #endregion Mail icon structure -->
        </ul>
      </div>
    </div>
  </div>
</footer>
